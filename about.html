<!DOCTYPE html>
<html lang="en" data-i18n-title="titleAbout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        (function () {
            var saved = localStorage.getItem("chaw-lang");
            var lang = (saved === "en" || saved === "ar" || saved === "ckb") ? saved : "";
            if (!lang) {
                var list = navigator.languages || [navigator.language || "en"];
                lang = "en";
                for (var i = 0; i < list.length; i++) {
                    var tag = String(list[i]).toLowerCase();
                    if (tag === "ckb" || tag.indexOf("ku") === 0) { lang = "ckb"; break; }
                    if (tag.indexOf("ar") === 0) { lang = "ar"; break; }
                }
            }
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === "ar" || lang === "ckb") ? "rtl" : "ltr";
            if (localStorage.getItem("chaw-account") === "1") {
                document.documentElement.classList.add("known-account");
            }
        })();
    </script>
    <title>About us — Chaw</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="stylesheet" href="styles.css?v=20261010w">
</head>
