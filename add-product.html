<!DOCTYPE html>
<html lang="en" data-i18n-title="titleAddProduct">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        (function () {
            var saved = localStorage.getItem("chaw-lang");
            var lang = (saved === "en" || saved === "ar" || saved === "ckb") ? saved : "";
            if (!lang) {
                var list = navigator.languages || [navigator.language || "en"];
                lang = "en";
                for (var i = 0; i < list.length; i++) {
                    var tag = String(list[i]).toLowerCase();
                    if (tag === "ckb" || tag.indexOf("ku") === 0) { lang = "ckb"; break; }
                    if (tag.indexOf("ar") === 0) { lang = "ar"; break; }
                }
            }
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === "ar" || lang === "ckb") ? "rtl" : "ltr";
            if (localStorage.getItem("chaw-guest") !== "1" && localStorage.getItem("chaw-account") !== "1") {
                document.documentElement.classList.add("entry-pending");
            }
            if (localStorage.getItem("chaw-account") === "1") {
                document.documentElement.classList.add("known-account");
            }
        })();
    </script>
    <title>Add product — Chaw</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500;600&family=Noto+Naskh+Arabic:wght@500;600&family=Noto+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20261009z">
</head>
<body>
    <nav>
        <a href="index.html" class="brand" data-i18n-aria="chawHome" aria-label="Chaw home">
            <img src="chaw-eye-white.png" alt="Chaw eye logo">
            <div class="logo">Chaw</div>
        </a>

        <ul>
            <li><a href="index.html" data-i18n="home">Home</a></li>
            <li><a href="discover.html" data-i18n="discover">Discover</a></li>
            <li id="dashboard-link" hidden><a href="dashboard.html" data-i18n="dashboard">Dashboard</a></li>
        </ul>

        <a href="login.html" class="nav-button" id="join-link" data-i18n="signIn">Sign in</a>
        <button type="button" id="account-button" class="account-button" hidden data-i18n-aria="yourAccount" aria-label="Your account">
            <img id="nav-avatar" alt="" hidden>
            <span id="nav-initial"></span>
        </button>
    </nav>

    <main id="add-product-page" class="add-product-page">
        <a class="back-link" href="account.html" data-i18n="backToProfile">Back to profile</a>
        <p id="add-product-note" hidden></p>
        <form id="add-product-form" class="account-card">
            <h1 id="account-publish-title" data-i18n="addProductButton">Add product</h1>
            <p data-i18n="chooseFilters">Pick tags from each section, such as Size or Color.</p>

            <label class="file-label" for="account-product-image" data-i18n="photos">Photos</label>
            <p class="field-hint" data-i18n="addMorePhotos">You can add more than one photo.</p>
            <div id="piece-photo-list" class="piece-photo-list"></div>
            <input id="account-product-image" type="file" accept="image/*" multiple>

            <label class="file-label" for="account-product-name" data-i18n="pieceName">Piece name</label>
            <input id="account-product-name" type="text" data-i18n-placeholder="pieceName" placeholder="Piece name">
            <label class="file-label" for="account-product-price" data-i18n="priceIqd">Price (IQD)</label>
            <input id="account-product-price" type="number" data-i18n-placeholder="priceIqd" placeholder="Price (IQD)">
            <label class="file-label" for="account-product-stock" data-i18n="stock">Stock</label>
            <input id="account-product-stock" type="number" data-i18n-placeholder="stock" placeholder="Stock">
            <label class="file-label" for="account-product-description" data-i18n="description">Description</label>
            <input id="account-product-description" type="text" data-i18n-placeholder="description" placeholder="Description">

            <div id="account-filters" class="filter-choices"></div>

            <div class="add-product-actions">
                <button type="button" id="account-publish-button" data-i18n="publish">Publish</button>
                <button type="button" id="account-cancel-edit" data-i18n="cancel">Cancel</button>
            </div>
            <p id="account-publish-message"></p>
        </form>
    </main>

    <footer>
        <p data-i18n="footer">© 2026 Chaw. All rights reserved.</p>
    </footer>

    <script type="module" src="app.js?v=20261009z"></script>
</body>
</html>
