<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign in — Chaw</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav>
        <a href="index.html" class="brand" aria-label="Chaw home">
            <img src="chaw-eye-white.png" alt="Chaw eye logo">
            <div class="logo">Chaw</div>
        </a>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="discover.html">Discover</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
        </ul>

        <a href="login.html" class="nav-button" id="join-link">Sign in</a>
        <button type="button" id="account-button" class="account-button" hidden aria-label="Your account">
            <img id="nav-avatar" alt="" hidden>
            <span id="nav-initial"></span>
        </button>
    </nav>

    <main>
        <section class="auth-section">
            <div class="auth-box">
                <h2>Sign in</h2>
                <p>Create an account or log in.</p>

                <input
                    type="email"
                    id="email"
                    placeholder="Email address"
                    autocomplete="email"
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="current-password"
                >

                <button id="signup-button">
                    Create Account
                </button>

                <button id="login-button">
                    Login
                </button>

                <p id="auth-message"></p>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Chaw. All rights reserved.</p>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
