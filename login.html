<!DOCTYPE html>
<html lang="en" data-i18n-title="titleSignIn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        (function () {
            var saved = localStorage.getItem("chaw-lang");
            var lang = (saved === "en" || saved === "ar" || saved === "ckb") ? saved : "";
            if (!lang) {
                var list = navigator.languages || [navigator.language || "en"];
                lang = "en";
                for (var i = 0; i < list.length; i++) {
                    var tag = String(list[i]).toLowerCase();
                    if (tag === "ckb" || tag.indexOf("ku") === 0) { lang = "ckb"; break; }
                    if (tag.indexOf("ar") === 0) { lang = "ar"; break; }
                }
            }
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === "ar" || lang === "ckb") ? "rtl" : "ltr";
        })();
    </script>
    <title>Sign in — Chaw</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500;600&family=Noto+Naskh+Arabic:wght@500;600&family=Noto+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20261010c">
</head>
<body>

    <nav>
        <a href="index.html" class="brand" data-i18n-aria="chawHome" aria-label="Chaw home">
            <img src="chaw-eye-white.png" alt="Chaw eye logo">
            <div class="logo">Chaw</div>
        </a>

        <ul>
            <li><a href="index.html" data-i18n="home">Home</a></li>
            <li><a href="discover.html" data-i18n="discover">Discover</a></li>
            <li id="dashboard-link" hidden><a href="dashboard.html" data-i18n="dashboard">Dashboard</a></li>
        </ul>

        <a href="login.html" class="nav-button" id="join-link" data-i18n="signIn">Sign in</a>
        <button type="button" id="account-button" class="account-button" hidden data-i18n-aria="yourAccount" aria-label="Your account">
            <img id="nav-avatar" alt="" hidden>
            <span id="nav-initial"></span>
        </button>
    </nav>

    <main>
        <section class="auth-section">
            <div class="auth-box">
                <h2 id="auth-heading" data-i18n="signInHeading">Sign in</h2>
                <p id="auth-lead" data-i18n="signInLead">Type your email and password. You can also use Google or Facebook.</p>

                <div class="auth-modes" id="auth-modes">
                    <button type="button" id="mode-signin" class="auth-mode is-active" data-i18n="signIn">Sign in</button>
                    <button type="button" id="mode-signup" class="auth-mode" data-i18n="createAccount">Create account</button>
                </div>

                <div id="email-login">
                    <form id="email-login-form">
                        <label for="email" data-i18n="emailAddress">Email address</label>
                        <input
                            type="email"
                            id="email"
                            autocomplete="email"
                        >

                        <label for="password" data-i18n="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            autocomplete="current-password"
                        >

                        <button type="submit" id="login-button" data-i18n="signIn">Sign in</button>
                        <button type="button" id="signup-button" hidden data-i18n="createAccount">Create account</button>
                    </form>
                    <button type="button" id="forgot-password" class="auth-link" data-i18n="forgotPassword">Forgot password</button>
                    <p id="auth-message"></p>
                </div>

                <p id="auth-or" class="auth-or" data-i18n="or">or</p>

                <div id="provider-signin">
                <button type="button" id="google-signin" class="google-signin">
                    <svg class="google-mark" viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
                        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
                        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
                        <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
                        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
                    </svg>
                    <span data-i18n="continueGoogle">Sign in with Google</span>
                </button>
                <button type="button" id="facebook-signin" class="facebook-signin">
                    <svg class="facebook-mark" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                        <path fill="#fff" d="M24 12.073C24 5.406 18.627 0 12 0S0 5.406 0 12.073C0 18.099 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.413c0-3.025 1.792-4.697 4.533-4.697 1.313 0 2.686.235 2.686.235v2.97h-1.513c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.099 24 12.073z"/>
                    </svg>
                    <span data-i18n="continueFacebook">Sign in with Facebook</span>
                </button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p data-i18n="footer">© 2026 Chaw. All rights reserved.</p>
    </footer>

    <script type="module" src="app.js?v=20261010n"></script>
</body>
</html>
