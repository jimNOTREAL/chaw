<!DOCTYPE html>
<html lang="en" data-i18n-title="titleCart">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        (function () {
            var saved = localStorage.getItem("chaw-lang");
            var lang = (saved === "en" || saved === "ar" || saved === "ckb") ? saved : "";
            if (!lang) {
                var list = navigator.languages || [navigator.language || "en"];
                lang = "en";
                for (var i = 0; i < list.length; i++) {
                    var tag = String(list[i]).toLowerCase();
                    if (tag === "ckb" || tag.indexOf("ku") === 0) { lang = "ckb"; break; }
                    if (tag.indexOf("ar") === 0) { lang = "ar"; break; }
                }
            }
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === "ar" || lang === "ckb") ? "rtl" : "ltr";
            if (localStorage.getItem("chaw-guest") !== "1" && localStorage.getItem("chaw-account") !== "1") {
                document.documentElement.classList.add("entry-pending");
            }
            if (localStorage.getItem("chaw-account") === "1") {
                document.documentElement.classList.add("known-account");
            }
        })();
    </script>
    <title>Cart — Chaw</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500;600&family=Noto+Naskh+Arabic:wght@500;600&family=Noto+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20261010c">
</head>
<body>
    <nav>
        <a href="index.html" class="brand" data-i18n-aria="chawHome" aria-label="Chaw home">
            <img src="chaw-eye-white.png" alt="Chaw eye logo">
            <div class="logo">Chaw</div>
        </a>

        <ul>
            <li><a href="index.html" data-i18n="home">Home</a></li>
            <li><a href="discover.html" data-i18n="discover">Discover</a></li>
            <li id="dashboard-link" hidden><a href="dashboard.html" data-i18n="dashboard">Dashboard</a></li>
        </ul>

        <a href="login.html" class="nav-button" id="join-link" data-i18n="signIn">Sign in</a>
        <button type="button" id="account-button" class="account-button" hidden data-i18n-aria="yourAccount" aria-label="Your account">
            <img id="nav-avatar" alt="" hidden>
            <span id="nav-initial"></span>
        </button>
    </nav>

    <main class="cart-page">
        <h1 data-i18n="cartHeading">Cart</h1>
        <div id="cart-list"></div>

        <h2 data-i18n="yourOrders">Your orders</h2>
        <div id="my-orders"></div>
        <p id="cart-message"></p>

        <div id="checkout-box">
            <p id="cart-total"></p>
            <div id="cart-fees"></div>
            <div id="guest-checkout" class="guest-checkout" hidden>
                <label for="guest-name" data-i18n="guestName">Customer name</label>
                <input id="guest-name" name="guest-name" type="text" autocomplete="name">
                <label for="guest-phone" data-i18n="guestPhone">Phone</label>
                <input id="guest-phone" name="guest-phone" type="tel" autocomplete="tel">
                <label for="guest-address" data-i18n="guestAddress">Delivery address</label>
                <textarea id="guest-address" name="guest-address" rows="3"></textarea>
                <button type="button" id="guest-location" data-i18n="useMyLocation">Use my location</button>
                <p id="guest-pin-note" class="field-hint"></p>
            </div>
            <p id="checkout-address"></p>
            <a class="text-link" id="checkout-edit" href="account.html" data-i18n="editDetails">Edit your details</a>
            <fieldset class="payment-choice">
                <legend data-i18n="howToPay">How do you want to pay?</legend>
                <label>
                    <input type="radio" name="payment" value="delivery" checked>
                    <span data-i18n="payOnDelivery">Pay on delivery</span>
                </label>
                <label>
                    <input type="radio" name="payment" value="card">
                    <span data-i18n="payByCard">Pay by card</span>
                </label>
            </fieldset>
            <p class="field-hint" data-i18n="payByCardNote">Pay by card opens the store’s payment link. Chaw does not ask for your card number.</p>
            <button type="button" id="checkout-button" data-i18n="placeOrder">Place order</button>
        </div>
    </main>

    <footer>
        <p data-i18n="footer">© 2026 Chaw. All rights reserved.</p>
    </footer>

    <script type="module" src="app.js?v=20261010q"></script>
</body>
</html>
