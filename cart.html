<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart — Chaw</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <a href="index.html" class="brand" aria-label="Chaw home">
            <img src="chaw-eye-white.png" alt="Chaw eye logo">
            <div class="logo">Chaw</div>
        </a>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="discover.html">Discover</a></li>
            <li id="dashboard-link" hidden><a href="dashboard.html">Dashboard</a></li>
        </ul>

        <a href="login.html" class="nav-button" id="join-link">Sign in</a>
        <button type="button" id="account-button" class="account-button" hidden aria-label="Your account">
            <img id="nav-avatar" alt="" hidden>
            <span id="nav-initial"></span>
        </button>
    </nav>

    <main class="cart-page">
        <h1>Cart</h1>
        <div id="cart-list"></div>
        <div id="checkout-box">
            <p id="cart-total"></p>
            <p id="checkout-address"></p>
            <a class="text-link" href="account.html">Edit your details</a>
            <fieldset class="payment-choice">
                <legend>How do you want to pay?</legend>
                <label>
                    <input type="radio" name="payment" value="delivery" checked>
                    Pay on delivery
                </label>
                <label>
                    <input type="radio" name="payment" value="card">
                    Pay by card
                </label>
            </fieldset>
            <p class="field-hint">Pay by card opens the store’s payment link. Chaw does not ask for your card number.</p>
            <button type="button" id="checkout-button">Place order</button>
        </div>
        <p id="cart-message"></p>

        <h2>Your orders</h2>
        <div id="my-orders"></div>
    </main>

    <footer>
        <p>© 2026 Chaw. All rights reserved.</p>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
