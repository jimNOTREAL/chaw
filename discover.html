<!DOCTYPE html>
<html lang="en" data-i18n-title="titleDiscover">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        (function () {
            var saved = localStorage.getItem("chaw-lang");
            var lang = (saved === "en" || saved === "ar" || saved === "ckb") ? saved : "";
            if (!lang) {
                var list = navigator.languages || [navigator.language || "en"];
                lang = "en";
                for (var i = 0; i < list.length; i++) {
                    var tag = String(list[i]).toLowerCase();
                    if (tag === "ckb" || tag.indexOf("ku") === 0) { lang = "ckb"; break; }
                    if (tag.indexOf("ar") === 0) { lang = "ar"; break; }
                }
            }
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === "ar" || lang === "ckb") ? "rtl" : "ltr";
            if (localStorage.getItem("chaw-guest") !== "1" && localStorage.getItem("chaw-account") !== "1") {
                document.documentElement.classList.add("entry-pending");
            }
            if (localStorage.getItem("chaw-account") === "1") {
                document.documentElement.classList.add("known-account");
            }
        })();
    </script>
    <title>Discover — Chaw</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&family=Noto+Naskh+Arabic:wght@500;600;700&family=Noto+Sans+Arabic:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20261010u">
</head>
<body class="discover-page market-home">
    <nav class="market-nav">
        <div class="nav-start">
            <a href="index.html" class="brand" data-i18n-aria="chawHome" aria-label="Chaw home">
                <img src="chaw-eye-white.png" alt="">
                <div class="logo">Chaw</div>
            </a>
            <ul class="nav-links">
                <li><a href="index.html" data-i18n="home">Home</a></li>
                <li><a href="discover.html" data-i18n="navProducts">Products</a></li>
                <li><a href="#categories" data-i18n="navSections">Categories</a></li>
                <li><a href="index.html#about" data-i18n="navAbout">About us</a></li>
                <li><a href="index.html#contact" data-i18n="navContact">Contact</a></li>
                <li id="dashboard-link" hidden><a href="dashboard.html" data-i18n="dashboard">Dashboard</a></li>
            </ul>
        </div>

        <form class="nav-search" action="discover.html" method="get">
            <label class="search-icon" for="home-search" data-i18n-aria="searchWant" aria-label="Search for what you want...">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M16 16l4 4"></path></svg>
            </label>
            <input id="home-search" name="q" type="search" data-i18n-placeholder="searchWant" placeholder="Search for what you want..." autocomplete="off">
        </form>

        <div class="nav-tools">
            <a href="login.html" class="nav-tool" id="join-link">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"></circle><path d="M5 19c1.4-3 3.8-4.5 7-4.5S17.6 16 19 19"></path></svg>
                <span data-i18n="myAccount">My account</span>
            </a>
            <button type="button" id="account-button" class="account-button nav-tool" hidden data-i18n-aria="yourAccount" aria-label="Your account">
                <img id="nav-avatar" alt="" hidden>
                <span id="nav-initial"></span>
                <span class="nav-tool-label" data-i18n="myAccount">My account</span>
            </button>
            <a href="discover.html" class="nav-tool icon-only" data-i18n-aria="savedPieces" aria-label="Saved pieces">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 4.6-7 9-7 9z"></path></svg>
                <span id="saved-count" class="nav-badge" hidden>0</span>
            </a>
            <a href="cart.html" class="nav-tool icon-only" id="cart-link" data-i18n-aria="cart" aria-label="Cart">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"></path><path d="M9 8V7a3 3 0 0 1 6 0v1"></path></svg>
                <span id="nav-cart-count" class="nav-badge" hidden>0</span>
            </a>
        </div>
    </nav>

    <main>
        <section class="discover-head">
            <h1 data-i18n="discoverHeadline">Discover what's around you.</h1>
            <p data-i18n="discoverLead">Find the best local stores, new fashion, and pieces that fit your style.</p>
            <div class="discover-tools">
                <label class="discover-search-wrap">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M16 16l4 4"></path></svg>
                    <input id="discover-search" type="search" data-i18n-placeholder="discoverSearchPlaceholder" placeholder="Search for a store, product, or brand..." autocomplete="off">
                </label>
                <label class="place-select">
                    <span data-i18n="yourPlace">Your place</span>
                    <select id="discover-area"></select>
                </label>
            </div>
        </section>

        <section class="discover-block" id="categories">
            <h2 data-i18n="shopByCategory">Shop by category</h2>
            <div id="category-row" class="category-row"></div>
        </section>

        <section class="discover-block" id="store-section">
            <h2 data-i18n="featuredStores">Featured stores</h2>
            <div id="store-row" class="store-row"></div>
        </section>

        <section class="discover-block" id="pieces">
            <h2 data-i18n="shopPieces">Pieces</h2>
            <div id="filter-bar" class="filter-bar"></div>
            <div id="discover-list" class="discover-grid"></div>
        </section>
    </main>

    <footer id="contact">
        <p data-i18n="footer">© 2026 Chaw. All rights reserved.</p>
    </footer>

    <script type="module" src="app.js?v=20261010v"></script>
</body>
</html>
